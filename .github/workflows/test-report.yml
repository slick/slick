name: 'Test Report'
on:
  workflow_run:
    workflows: [ 'CI' ]                     # runs after CI workflow
    types:
      - completed
  workflow_dispatch:                        # manual run, e.g. to test changes to this workflow from a branch
    inputs:
      run_id:
        description: 'ID of the CI workflow run whose test-results artifacts to report on'
        required: true
        type: string
jobs:
  report:
    runs-on: ubuntu-latest
    # A cancelled CI run (e.g. superseded by a newer push via cancel-in-progress)
    # has only partial results; reporting on them would be noise.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    steps:
      # dorny/test-reporter runs `git ls-files` to map test failures to source
      # files, so the repository must be checked out even in a workflow_run job.
      # The default branch is checked out on purpose: this job runs with the base
      # repository's write token, and actions/checkout refuses to fetch fork PR
      # code in that context. The file list of main is sufficient for mapping.
      - uses: actions/checkout@v7
      # Each matrix job uploads the same relative file paths, so the artifacts must
      # not be merged into one directory: parallel extraction of identical paths
      # races and corrupts files, and even without the race only one matrix cell
      # would survive. Each artifact gets its own subdirectory under test-results/.
      - name: Download test result artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: 'test-results/**/TEST-*.xml'
          reporter: java-junit
          # CI runs that fail before the test step (e.g. compile errors) upload no
          # artifacts; CI already reports that failure, so don't fail here as well.
          fail-on-empty: false
