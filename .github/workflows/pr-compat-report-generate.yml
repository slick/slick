name: Generate PR compat report

on:
 pull_request:
   branches: ['**']

env:
  JAVA_VERSION: "17"

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      name: Check out PR base
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.base.sha }}

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: sbt

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    # This job runs sbt in several steps. By default the sbt 2 runner starts a background sbt server in the first step
    # and later steps reuse it, so they see the first step's environment, including its GITHUB_OUTPUT file. --server
    # runs sbt in the foreground instead, so each step gets its own environment.
    - name: Get base version
      id: getBaseVer
      run: sbt --server writeVersionToGitHubOutput

    - run: sbt --server publishLocal
      name: Publish ${{ steps.getBaseVer.outputs.result }} locally

    - uses: actions/checkout@v7
      name: Check out PR
      with:
        fetch-depth: 0
        clean: false

    # The sbt 2 runner joins all arguments into one command line, so separate commands with ';'
    - run: sbt --server "clean; compile"

    - name: Generate compatibility changes report
      id: createReport
      run: |
        sbt --server \
          'set every CompatReportPlugin.previousRelease := Some("${{ steps.getBaseVer.outputs.result }}"); writeCompatReportToGitHubOutput'

    - name: Show report saved in ${{ steps.createReport.outputs.result }}
      run: cat ${{ steps.createReport.outputs.result }}

    - name: Prepare artifact contents
      run: |
        mkdir -p ./compat-report
        cp ${{ steps.createReport.outputs.result }} ./compat-report/compat-report.md
        echo ${{ github.event.number }} > ./compat-report/NR.txt

    - uses: actions/upload-artifact@v7
      with:
        name: compat-report
        path: compat-report/
