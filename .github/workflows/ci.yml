name: CI

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  # language=json
  JAVA_VERSIONS: '{ "javaMin": "17", "javaLatest": "23" }'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ javaMin, javaLatest ]
        scala: [ 2.12.x, 2.13.x, 3.x ]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
        ports:
          - 49161:1521
      db2:
        image: ibmcom/db2:11.5.8.0
        ports:
          - 50000:50000
        env:
          DB2INST1_PASSWORD: db2inst1-pwd
          DB2INSTANCE: db2inst1
          DBNAME: SLICKTST
          LICENSE: accept
        # DB2 takes several minutes to create SLICKTST on first start. Without a
        # health check the build can reach the codegen/testkit DB2 connection
        # before the database exists (SQLCODE=-1035, SQLSTATE=57019).
        # The image touches this marker right after ACTIVATE DATABASE. Do not
        # probe with `db2 connect` instead: each CLP probe leaves an orphaned
        # db2bp connection behind, which makes admin_drop_schema fail in the
        # testkit cleanup (SQL0478N).
        options: >-
          --privileged
          --health-cmd "test -f /database/config/.shared-data/setup_complete"
          --health-start-period 90s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start MySQL
        run: docker run -d -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -p 3306:3306 mysql --disable-log-bin

      # SQL Server is deliberately not a service container. SQL Server 2025 intermittently dies
      # during startup (sqlpal fatal error: errno 11 in lsass, or AppLoader 0xC0000001) when it
      # boots at the same time as the privileged DB2 container runs its initial setup on the same
      # CPUs. Service containers all start together; by the time this step runs, DB2 is healthy
      # and its setup is finished. Readiness is checked here so the build never races it, and a
      # crashed start is retried.
      - name: Start SQL Server
        run: |
          for attempt in 1 2 3; do
            docker rm -f sqlserver >/dev/null 2>&1 || true
            docker run -d --name sqlserver -p 1401:1433 \
              -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Freeslick18 \
              mcr.microsoft.com/mssql/server:2025-latest
            for i in $(seq 1 60); do
              if docker logs sqlserver 2>&1 | grep -q 'Recovery is complete'; then
                echo "SQL Server is ready (attempt $attempt)"
                exit 0
              fi
              if docker logs sqlserver 2>&1 | grep -q 'fatal error'; then
                echo "::warning::SQL Server crashed during startup (attempt $attempt), retrying"
                docker logs sqlserver 2>&1 | grep -E 'Reason|Message|errno' | head -5
                break
              fi
              sleep 2
            done
          done
          echo "::error::SQL Server did not start after 3 attempts"
          docker logs sqlserver 2>&1 | tail -40
          exit 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: ${{ fromJson(env.JAVA_VERSIONS)[matrix.java] }}
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Build and test
        run: |
          sbt ++${{ matrix.scala }} coverage testAll coverageReport
        env:
          COURSIER_REPOSITORIES: "https://repo.maven.apache.org/maven2"
          SLICK_TESTKIT_CONFIG: test-dbs/testkit.github-actions.conf
          TZ: Asia/Kamchatka
          SLICK_SKIP_DIAGRAMS: "true"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()    # run this step even if a previous step failed
        with:
          name: test-results-${{ matrix.java }}-scala${{ matrix.scala }}
          path: '**/target/test-reports/TEST-*.xml'

  deploy_docs:
    name: Deploy Docs
    needs: [ build ]
    # Only the upstream repository publishes to the documentation site; forks skip this job
    if: github.repository == 'slick/slick' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ts-graphviz/setup-graphviz@v2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: ${{ fromJson(env.JAVA_VERSIONS)['javaMin'] }}
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Create deploy key
        run: |
          echo "${{ secrets.PUBLISH_DOCS_KEY }}" > deploy-key
          chmod 600 deploy-key

      - name: Set git user config to github actions bot
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Publish docs to website
        run: GIT_SSH_COMMAND="ssh -i $(pwd)/deploy-key" sbt site/deployDocs

  publish:
    name: Release
    needs: [ build ]
    # Only the upstream repository releases to Maven Central; forks skip this job
    if: github.repository == 'slick/slick' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ts-graphviz/setup-graphviz@v2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: ${{ fromJson(env.JAVA_VERSIONS)['javaMin'] }}
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Publish artifacts to Maven Central
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: sbt ci-release
